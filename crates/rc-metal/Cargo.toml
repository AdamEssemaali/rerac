[package]
name = "rc-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "ReRAC's runtime on a native Metal renderer, without Bevy (macOS and iOS). docs/plan/metal_renderer.md."

# Its own executable next to rc-engine's Bevy/wgpu one: `cargo run -p rc-metal --release` (iOS: tools/package/ios.sh).
[[bin]]
name = "rerac-metal"
path = "src/main.rs"

[dependencies]
rc-formats = { path = "../rc-formats" }
rc-data = { path = "../rc-data" }
rc-game = { path = "../rc-game" }
rc-video = { path = "../rc-video" }
anyhow.workspace = true
glam = "0.32"
hecs = "0.11"
png = "0.18"
naga = { version = "29", features = ["wgsl-in", "msl-out"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_vendor = "apple")'.dependencies]
rodio = { version = "0.22", default-features = false, features = ["playback"] }
winit = "0.30"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
raw-window-handle = "0.6"
raw-window-metal = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
gilrs = "0.11"

# iOS: controllers and the hardware keyboard through Apple's GameController framework (gilrs has no iOS backend).
[target.'cfg(target_os = "ios")'.dependencies]
objc2-game-controller = "0.3"

[features]
# rc-engine's `dev` feature gates the dev keys (noclip); kept so `cfg!(feature = "dev")` means the same here.
dev = []
